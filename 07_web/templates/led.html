<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>LED ON/OFF</h1>

    <button onclick="led_op(1, 'green')">GREEN LED ON</button>
    <button onclick="led_op(2, 'green')">GREEN LED OFF</button>
    <button onclick="led_op(1, 'blue')">BLUE LED ON</button>
    <button onclick="led_op(2, 'blue')">BLUE LED OFF</button>


    <div id="result">

    </div>

    <script>
        function led_op(op, color){
            let url = (op == 1 ) ? `/led/${color}/on` : `/led/${color}/off`;

            fetch(url)
            .then(response => response.text()) 
            .then(data => {
                let result = document.getElementById("result");
                result.innerHTML = `<h1>${color} ${data}</h1>`
            })
        }
    </script>
</body>
</html>
